org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
# ★ 2026-09-24: the belt to BuildTools.getJson's braces (buildSrc). The Fabric metadata calls in
# fabric/build.gradle run in the CONFIGURATION phase against meta.fabricmc.net, whose Cloudflare A
# records intermittently include a blackholed IP (measured: 104.21.33.240 times out, 172.67.151.177
# answers). Java's default is NO timeout, so a stalled connection hangs the whole build before any task
# runs: the console shows ":buildSrc:compileGroovy NO-SOURCE" and then nothing, forever.
# Verified on this JDK 21: with defaultReadTimeout=2000 a hanging read throws SocketTimeoutException
# after 2023 ms instead of blocking, and getJson's own 5-attempt retry loop then recovers.
systemProp.sun.net.client.defaultConnectTimeout=15000
systemProp.sun.net.client.defaultReadTimeout=20000
# ★ 2026-09-24: the ROUTE, not just the timeout. On this network meta.fabricmc.net cannot be read on the
# direct route at all - measured from Java with the timeouts above: read timed out after 42 s (yarn) and
# 23 s (loader) - while the same two requests through the local Clash proxy answer in 5 s and 48 s. So the
# build JVM goes through the proxy. maven.fabricmc.net is EXCLUDED on purpose: it answers directly in
# 1.1 s and the proxy's TLS for it dies mid-handshake, and the exclusions must name loopback or the game's
# own HTTP calls would be sent back into the proxy. Without Clash running, the two timeout lines above turn
# this back into a loud failure instead of a hang.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# ★ 2026-09-29: api.modrinth.com 也排除代理（与 maven.fabricmc.net 同一个理由）。
# BuildTools.getFabricApiVersion / getJadeVersion / getWthitVersion / getModMenuVersion 都走
# ModId.getModFiles -> api.modrinth.com。实测（2026-09-29 18:0x，各 5 次）：
#     直连      : 200 200 200 200 200   （5/5）
#     走 7890   : FAIL 200 200 200 200  （1/5 失败：SSLHandshakeException: Remote host terminated the handshake）
# 失败一次就够毁掉整次构建 —— ModId.getModFiles 把异常 printStackTrace 后**返回空列表**，
# 上层 .get(0) 于是抛 `Index 0 out of bounds for length 0`，报错完全看不出是网络问题：
#     A problem occurred evaluating project ':fabric'.
#     > Index 0 out of bounds for length 0
#        at org.mtr.mod.BuildTools.getFabricApiVersion(BuildTools.java:92)
# 而且它是**间歇性**的，所以表现为"这次能过、下次不能"。files.modrinth.com（mod 本体下载）一并排除。
systemProp.http.nonProxyHosts=maven.fabricmc.net|api.modrinth.com|files.modrinth.com|localhost|127.0.0.1
org.gradle.parallel=true
org.gradle.daemon=false
