pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "+"
}

include("fabric")

/*
 * forge 是**可选**子工程（notes/220）。
 *
 * 为什么默认不包含：本仓加在 `game/forge/src/main/java/org/mtr/mod/mmtr/**` 下的那些文件是
 * **按 fabric/Yarn 写的**（`net.fabricmc.*`、`net.minecraft.server.world` …），在 forge 映射下编不过。
 * 于是 `:forge:compileJava` 一直失败，而**任何"编译所有子工程"的动作都会连带失败** ——
 * 最要紧的那个是 IDEA 的 Gradle 导入：它失败后只留下半个项目模型（连 `:fabric` 模块都不注册），
 * 现象就是「IDEA 里 Minecraft Server (:fabric) 拉不起来」，且日志里看不到任何游戏输出。
 * 实测（notes/220）：IDEA 的 idea.log 里是
 *   `ExternalSystemException: Compilation failed` + `forge/.../MmtrSignalChunkTracker.java:0: 程序包 net.fabricmc... 不存在`。
 *
 * fabric 才是本仓的开发目标（dev-server/dev-client、IDEA 的两个运行配置都是 fabric）。
 * 真要构建 forge：`gradlew -Pmmtr.forge=true :forge:build`（把那份源码先对齐到 forge 映射）。
 */
if (providers.gradleProperty("mmtr.forge").getOrNull() == "true") {
	include("forge")
}

rootProject.name = "Minecraft-Transit-Railway"
