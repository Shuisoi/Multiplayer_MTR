<div class="mmtr-console">
	<header class="mmtr-topbar">
		<div class="mmtr-brand">MMTR<span class="mmtr-brand-sub">运营台</span></div>
		<div class="mmtr-status">
			<span class="mmtr-stat">车辆 <b>{{ vehicles() }}</b></span>
			<span class="mmtr-stat">运行 <b>{{ onRoute() }}</b></span>
			<span class="mmtr-stat">岔口 <b>{{ forks() }}</b></span>
			<span class="mmtr-stat">人工 <b>{{ manualPoints() }}</b></span>
			<span class="mmtr-stat" [class.mmtr-alert]="lockedPoints() > 0">锁定 <b>{{ lockedPoints() }}</b></span>
			<span class="mmtr-stat">线路 <b>{{ lineCount() }}</b></span>
			<span class="mmtr-clock">{{ clock() }}</span>
		</div>
		<button class="mmtr-ops-toggle" [class.open]="drawerOpen()" (click)="toggleDrawer()">
			{{ drawerOpen() ? "收起运营 ✕" : "运营面板 ≡" }}
		</button>
	</header>
	<div class="mmtr-main">
		<div class="mmtr-map">
			<app-map/>
		</div>
		<div class="mmtr-map-overlays-right">
			<div class="mmtr-layer-switch">
				<span class="mmtr-layer-switch-title">图层</span>
				<button class="mmtr-chip" [class.on]="layersService.points()" (click)="layersService.points.set(!layersService.points())">道岔</button>
				<button class="mmtr-chip" [class.on]="layersService.linesLayer()" (click)="layersService.linesLayer.set(!layersService.linesLayer())">线路</button>
				<button class="mmtr-chip" [class.on]="layersService.rails()" (click)="layersService.rails.set(!layersService.rails())">轨道</button>
				<button class="mmtr-chip mmtr-chip-reset" (click)="resetLayers()">重置</button>
			</div>
		</div>
		<div class="mmtr-map-overlays">
			<div class="mmtr-layer-chips">
				<button class="mmtr-chip" [class.on]="layersService.rails()" (click)="layersService.rails.set(!layersService.rails())">轨道</button>
				<button class="mmtr-chip" [class.on]="layersService.linesLayer()" (click)="layersService.linesLayer.set(!layersService.linesLayer())">线路</button>
				<button class="mmtr-chip" [class.on]="layersService.points()" (click)="layersService.points.set(!layersService.points())">道岔</button>
			</div>
			<app-mmtr-lines-panel/>
		</div>
		<aside class="mmtr-drawer" [class.open]="drawerOpen()">
			<app-mmtr-ops-panel/>
		</aside>
	</div>
</div>
