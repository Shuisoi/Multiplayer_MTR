@if (lines().length > 0) {
	<div class="mmtr-lines-panel">
		<div class="mmtr-lines-head">
			<span class="mmtr-lines-title">线路</span>
			<span class="mmtr-lines-count">{{ lines().length }} 条 · {{ totalRails() }} 轨</span>
			<button class="mmtr-chip" (click)="all(true)">全显</button>
			<button class="mmtr-chip" (click)="all(false)">全隐</button>
		</div>
		<div class="mmtr-lines-list">
			@for (line of lines(); track line.id) {
				<div class="mmtr-line-row" [class.focused]="focusedLine() === line.id" [class.hidden]="!visibleLines().includes(line.id)"
				     role="button" tabindex="0" (click)="focus(line.id)" (keydown.enter)="focus(line.id)">
					<button class="mmtr-line-toggle" [class.on]="visibleLines().includes(line.id)" (click)="toggle(line); $event.stopPropagation()">●</button>
					<span class="mmtr-line-id">{{ line.name }}</span>
					<span class="mmtr-line-meta">{{ line.rails.length }} 轨 · {{ (line.lengthM / 1000).toFixed(1) }} km</span>
				</div>
			}
		</div>
	</div>
}
